name: Continuous Integration

on:
  push:
    branches: [ main, master, "release/**", "joss/**", "repair/**" ]
  pull_request:
    branches: [ main, master, "release/**" ]

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies and package
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[test,dev]"

    - name: Verify dependency health
      run: |
        python -m pip check

    - name: Run automated Pytest suite
      run: |
        python -m pytest tests/ -v

    - name: Verify CLI interface
      run: |
        tf-explorer --help

    - name: Verify public API exports
      run: |
        python -c "import tf_explorer; from tf_explorer import calculate_promoter_coordinates, CandidateScreener, DisagreementEngine; start, end = calculate_promoter_coordinates(10000, '+', 2000, 500); assert (start, end) == (8000, 10500)"

    - name: Run offline quickstarts
      run: |
        python examples/quickstart_promoter.py
        python examples/quickstart_disagreement.py

    - name: Validate distribution build
      run: |
        python -m build
