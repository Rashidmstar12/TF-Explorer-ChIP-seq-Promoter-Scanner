[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tf-explorer"
version = "1.3.0"
description = "Analyze transcription factor ChIP-seq binding at any human gene promoter using ENCODE and JASPAR."
authors = [
  { name="Rashidmstar12", email="rashidmstar@pondiuni.ac.in" },
]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
    "bioinformatics", "genomics", "transcription-factor", "ChIP-seq",
    "ENCODE", "JASPAR", "promoter", "motif", "epigenomics", "streamlit"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "pandas",
    "biopython",
    "matplotlib",
    "seaborn",
    "mygene",
    "pyyaml",
    "streamlit",
    "primer3-py",
]

[project.scripts]
tf-explorer = "tf_explorer.cli:main"

[project.urls]
"Homepage" = "https://github.com/Rashidmstar12/TF-Explorer-ChIP-seq-Promoter-Scanner"
"Source" = "https://github.com/Rashidmstar12/TF-Explorer-ChIP-seq-Promoter-Scanner"
"Bug Tracker" = "https://github.com/Rashidmstar12/TF-Explorer-ChIP-seq-Promoter-Scanner/issues"
