[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tf-explorer"
version = "3.1.0rc1"
description = "Epigenetic Promoter Scanner & Regulatory Disagreement Engine for Human Transcription Factors."
authors = [
  { name="Rashid M.", email="rashidmstar@pondiuni.ac.in" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "requests>=2.28.0",
    "pandas>=1.5.0",
    "numpy>=1.22.0",
    "biopython>=1.80",
    "scipy>=1.9.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "mygene>=3.2.2",
    "pyyaml>=6.0",
    "platformdirs>=3.0.0",
    "tenacity>=8.2.0",
    "python-docx>=0.8.11",
    "streamlit>=1.20.0",
]

[project.optional-dependencies]
primer = [
    "primer3-py>=2.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "build>=1.0.0",
    "wheel>=0.40.0",
]

[project.scripts]
tf-explorer = "tf_explorer.cli:main"

[project.urls]
"Homepage" = "https://github.com/Rashidmstar12/TF-Explorer-ChIP-seq-Promoter-Scanner"
"Repository" = "https://github.com/Rashidmstar12/TF-Explorer-ChIP-seq-Promoter-Scanner"
"Bug Tracker" = "https://github.com/Rashidmstar12/TF-Explorer-ChIP-seq-Promoter-Scanner/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["tf_explorer*"]
exclude = ["tests*", "examples*", "staging*", "scratch*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
