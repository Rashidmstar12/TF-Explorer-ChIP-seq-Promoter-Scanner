[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tf-explorer"
version = "0.1.0"
description = "A tool to explore TF binding sites for any gene using ENCODE and JASPAR."
authors = [
  { name="Antigravity", email="antigravity@example.com" },
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "pandas",
    "biopython",
    "matplotlib",
    "seaborn",
    "mygene",
    "pyyaml",
    "streamlit"
]

[project.scripts]
tf-explorer = "tf_explorer.cli:main"

[project.urls]
"Homepage" = "https://github.com/example/tf-explorer"
